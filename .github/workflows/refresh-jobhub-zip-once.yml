name: Refresh JobHub ZIP archives once

on:
  push:
    branches:
      - chore/refresh-jobhub-zip

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chore/refresh-jobhub-zip
          fetch-depth: 0

      - name: Build both current source archives
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import zipfile

          root = Path.cwd()
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          excluded = {
              "PremierBWJobhub-main (1).zip",
              "PremierBWJobhub-main (2).zip",
              ".github/workflows/refresh-jobhub-zip-once.yml",
          }
          source_files = [p for p in files if p not in excluded and not p.endswith(".zip")]

          for archive_name in (
              "PremierBWJobhub-main (1).zip",
              "PremierBWJobhub-main (2).zip",
          ):
              archive = root / archive_name
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  for rel in source_files:
                      path = root / rel
                      if path.is_file():
                          zf.write(path, f"PremierBWJobhub-main/{rel}")
                  zf.writestr(
                      "PremierBWJobhub-main/BUILD_COMMIT.txt",
                      f"Built from GitHub commit {commit}\n",
                  )
          PY

      - name: Verify both ZIP files
        run: |
          unzip -t "PremierBWJobhub-main (1).zip"
          unzip -t "PremierBWJobhub-main (2).zip"

      - name: Commit refreshed archives
        run: |
          rm .github/workflows/refresh-jobhub-zip-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "PremierBWJobhub-main (1).zip" "PremierBWJobhub-main (2).zip" .github/workflows/refresh-jobhub-zip-once.yml
          git commit -m "Refresh current JobHub source ZIP archives"
          git push origin HEAD:chore/refresh-jobhub-zip
