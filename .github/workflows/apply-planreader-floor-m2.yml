name: Apply PlanReader floor m2 feature

on:
  push:
    branches:
      - agent/planreader-floor-m2-calibration

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/planreader-floor-m2-calibration
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply deterministic patch
        run: python scripts/apply_planreader_floor_m2_patch.py
      - name: Compile PlanReader
        run: python -m py_compile pb_planreader_app.py planreader_substrate_component/__init__.py
      - name: Test floor m2 feature
        run: python -m unittest tests.test_planreader_floor_m2 -v
      - name: Test existing PlanReader measurement suites
        run: |
          python -m unittest tests.test_planreader_bluebeam -v
          python -m unittest tests.test_planreader_takeoff -v
          python -m unittest tests.test_planreader_substrate_boxes -v
      - name: Commit feature and remove one-off patch machinery
        run: |
          rm -f scripts/apply_planreader_floor_m2_patch.py .github/workflows/apply-planreader-floor-m2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pb_planreader_app.py tests/test_planreader_floor_m2.py scripts/apply_planreader_floor_m2_patch.py .github/workflows/apply-planreader-floor-m2.yml
          if git diff --cached --quiet; then
            echo "No feature changes to commit"
            exit 0
          fi
          git commit -m "Add calibrated floor m2 measurement to PlanReader"
          git push origin HEAD:agent/planreader-floor-m2-calibration
