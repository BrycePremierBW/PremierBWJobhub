name: Apply stage percentage widget key fix

on:
  push:
    branches:
      - fix/stage-preset-duplicate-key

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stage-preset-duplicate-key
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Patch stage percentage widget keys
        run: python .github/scripts/fix_stage_preset_duplicate_key.py

      - name: Compile changed modules
        run: python -m py_compile pb_jobhub_app.py jobhub/stage_preset_guard.py

      - name: Commit fix and remove one-time helpers
        run: |
          rm .github/workflows/fix-stage-preset-duplicate-key-once.yml
          rm .github/scripts/fix_stage_preset_duplicate_key.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pb_jobhub_app.py jobhub/stage_preset_guard.py tests/test_stage_preset_duplicate_key.py .github/workflows/fix-stage-preset-duplicate-key-once.yml .github/scripts/fix_stage_preset_duplicate_key.py
          git commit -m "Fix duplicate stage percentage widget keys"
          git push origin HEAD:fix/stage-preset-duplicate-key
