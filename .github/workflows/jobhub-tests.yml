name: JobHub tests

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPYCACHEPREFIX: /tmp/jobhub-pycache
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jobhub_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest sqlglot ruff
      - name: Compile application modules
        run: >-
          python -m compileall -q
          pb_jobhub_app.py
          jobhub_enterprise.py
          jobhub_delete_integrity.py
          pb_jobhub_visual_scheduler.py
          jobhub_feedback.py
          jobhub_core.py
          jobhub
          jobhub_v2
          jobhub_v4
      - name: Check undefined names and local-scope errors
        run: ruff check . --select F821,F823
      - name: Run JobHub tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run PostgreSQL integration smoke
        env:
          JOBHUB_POSTGRES_CI_URL: postgresql://postgres:postgres@127.0.0.1:5432/jobhub_ci
        run: python tests/test_postgres_ci.py
      - name: Run PostgreSQL permanent-job-delete regression
        env:
          JOBHUB_POSTGRES_CI_URL: postgresql://postgres:postgres@127.0.0.1:5432/jobhub_ci
        run: python tests/test_job_delete_integrity_postgres.py
      - name: Run material order workflow
        run: python tests/material_order_workflow_test.py
      - name: Render every JobHub route
        run: python tests/smoke_test.py
      - name: Run populated staged-job workflow
        run: python tests/run_stage_control_ci.py
