name: JobHub V2 tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [operations-v2]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile application modules
        run: python -m compileall -q pb_jobhub_app.py jobhub_enterprise.py pb_jobhub_visual_scheduler.py jobhub_feedback.py jobhub_v2 jobhub_v3 jobhub_v4
      - name: Run JobHub tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee test-results.txt
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-test-output
          path: test-results.txt
          if-no-files-found: warn
