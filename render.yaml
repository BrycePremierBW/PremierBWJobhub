services:
  - type: web
    name: PremierBWJobhub
    runtime: python
    region: singapore
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run pb_jobhub_app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true
    healthCheckPath: /_stcore/health
    disk:
      name: jobhub-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: JOBHUB_ALLOW_EXTERNAL_AI
        value: "true"
      - key: STREAMLIT_SERVER_COOKIE_SECRET
        sync: false
      - key: JOBHUB_AI_INCLUDE_PERSONAL_DATA
        value: "false"
      - key: JOBHUB_ENABLE_SELF_EDIT
        value: "false"
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_REST_API_KEY
        sync: false
      - key: JOBHUB_PUBLIC_URL
        sync: false
